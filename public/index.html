<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Market View</title>
</head>

<body>

  <main>
    <h1>Market View</h1>

    <div>
      <label for="symbolFilter">
        Symbol
      </label>

      <input
        id="symbolFilter"
        type="text"
        placeholder="EURUSD"
      >

      <button id="refreshButton">
        Refresh
      </button>
    </div>

    <p id="status"></p>

    <table border="1">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Best Bid</th>
          <th>Best Ask</th>
          <th>Total Quantity</th>
          <th>Quotes</th>
        </tr>
      </thead>

      <tbody id="marketTableBody"></tbody>
    </table>
  </main>

  <script src="/app.js"></script>

</body>
</html>
