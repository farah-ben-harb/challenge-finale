<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Market View</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5f5f5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 8px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      flex: 1;
    }

    button {
      padding: 10px 18px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f0f0f0;
    }

    #status {
      margin-bottom: 16px;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Market View</h1>

    <div class="controls">

      <input
        id="symbolFilter"
        type="text"
        placeholder="Filter symbol, e.g. EURUSD"
      >

      <button id="refreshButton">
        Refresh
      </button>

    </div>

    <div id="status"></div>

    <table>

      <thead>
        <tr>
          <th>Symbol</th>
          <th>Best Bid</th>
          <th>Best Ask</th>
          <th>Total Quantity</th>
          <th>Quotes</th>
        </tr>
      </thead>

      <tbody id="marketTableBody"></tbody>

    </table>

  </main>

  <script src="/app.js"></script>

</body>
</html>
